<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpg" href="/amber.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>托贝诺特 世界观 Wiki</title>
    <meta name="description" content="托贝诺特世界观 Wiki — 人物、地点、事件、物品与概念的世界构建百科。" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://wiki.tobenot.top/" />

    <!-- JSON-LD 结构化数据：站点级 WebSite schema（条目级 canonical 由 usePageMeta 运行时覆盖） -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "托贝诺特世界观 Wiki",
      "alternateName": "Tobenot Story Wiki",
      "url": "https://wiki.tobenot.top/",
      "inLanguage": "zh-CN",
      "description": "托贝诺特世界观的中文百科，收录人物、地点、事件、物品与概念等世界构建条目。"
    }
    </script>

    <!-- Open Graph / 社交分享默认卡片（站点级；条目级由 usePageMeta 运行时覆盖） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="托贝诺特世界观 Wiki" />
    <meta property="og:title" content="托贝诺特世界观 Wiki" />
    <meta property="og:description" content="人物、地点、事件、物品与概念的世界构建百科。" />
    <meta property="og:image" content="https://wiki.tobenot.top/images/og-cover.jpg" />
    <meta property="og:url" content="https://wiki.tobenot.top/" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="托贝诺特世界观 Wiki" />
    <meta name="twitter:description" content="人物、地点、事件、物品与概念的世界构建百科。" />
    <meta name="twitter:image" content="https://wiki.tobenot.top/images/og-cover.jpg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
